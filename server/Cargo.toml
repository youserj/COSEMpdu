[package]
name = "server"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
cosempdu = { path = "../cosempdu", default-features = false }
critical-section = "1.2"
dlms1 = { path = "../DLMS1", default-features = false }

[features]
default = ["std", "aes128", "aes256"]
std = ["cosempdu/std", "dlms1/std", "critical-section/std"]
optical = []
tcp = []
ble = []
aes128 = []
aes256 = []
ecdsa_p256 = ["cosempdu/ecdsa_p256"]
ecdsa_p384 = ["cosempdu/ecdsa_p384"]
association_ln_v2 = ["cosempdu/association_ln_v2"]
